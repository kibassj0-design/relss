<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Lalezar&display=swap">
<style>
:root{--accent:#E8B04A;--bg1:#14100a;--bg2:#000;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Cairo",sans-serif;color:#F4EFE4}
#bg{position:absolute;inset:-200px}
#parts,#grain{position:absolute;inset:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75) 100%)}
#top{position:absolute;top:150px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px}
.pill{font-weight:800;font-size:34px;padding:8px 28px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);background:rgba(0,0,0,.35);letter-spacing:.02em}
#prog{width:640px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;margin-right:0;margin-left:auto}
#stage{position:absolute;left:90px;right:90px;top:360px;height:1100px;display:flex;align-items:center;justify-content:center}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
.lines{display:flex;flex-direction:column;gap:18px;align-items:center}
.line{font-weight:900;line-height:1.45;font-size:var(--fs,78px);text-shadow:0 6px 30px rgba(0,0,0,.8)}
.w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.w.hl{color:var(--accent)}
.big{font-family:"Lalezar","Cairo";font-size:260px;line-height:1;color:var(--accent);text-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent),0 10px 40px rgba(0,0,0,.9);direction:ltr;font-variant-numeric:tabular-nums}
.biglabel{font-weight:800;font-size:58px;color:#F4EFE4;opacity:.9}
.emoji{font-family:"Noto Color Emoji";font-size:230px;line-height:1;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:4px solid var(--accent);opacity:0}
.cta-arrow{font-size:120px;color:var(--accent);font-weight:900}
#brand{position:absolute;bottom:430px;left:0;right:0;text-align:center;font-weight:800;font-size:32px;color:rgba(244,239,228,.55)}
#photos{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.88) 100%)}
.ph.old img{filter:sepia(.35) contrast(1.08) saturate(.8)}
.card{position:absolute;left:50%;top:380px;width:600px;height:600px;margin-left:-300px;border:14px solid #f3ede0;border-bottom-width:60px;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.8);overflow:hidden;opacity:0;background:#222}
.card img{width:100%;height:100%;object-fit:cover}
.scene.withimg{justify-content:flex-end;padding-bottom:40px}
.scene.withcard{justify-content:flex-end;padding-bottom:0;top:720px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cinema #stage{top:auto;bottom:250px;height:640px}
.cinema .scene{justify-content:flex-end;gap:24px}
.cinema .line{font-size:var(--fs,70px);line-height:1.4;paint-order:stroke fill;-webkit-text-stroke:10px rgba(0,0,0,.85);text-shadow:0 4px 24px rgba(0,0,0,.95)}
.cinema .cta-arrow{font-size:90px}
.cinema .sub{display:none;max-width:900px}
.cinema #parts{display:none}

/* ---- channel identity: 5ssj5 ---- */
#idframe{position:absolute;inset:0;pointer-events:none}
#idframe i{position:absolute;width:70px;height:70px;border-color:rgba(242,176,53,.85);border-style:solid;border-width:0}
#idframe .c1{top:110px;right:40px;border-top-width:4px;border-right-width:4px}
#idframe .c2{top:110px;left:40px;border-top-width:4px;border-left-width:4px}
#idframe .c3{bottom:200px;right:40px;border-bottom-width:4px;border-right-width:4px}
#idframe .c4{bottom:200px;left:40px;border-bottom-width:4px;border-left-width:4px}
#badge{display:flex;align-items:center;gap:16px;direction:ltr;padding:10px 26px 10px 12px;border-radius:999px;background:rgba(0,0,0,.55);border:2px solid rgba(242,176,53,.7);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#badge .logo{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd77a,#F2B035 45%,#8a5a12);display:flex;align-items:center;justify-content:center;font-family:"Lalezar";font-size:30px;color:#120c02;box-shadow:0 0 22px rgba(242,176,53,.6)}
#badge .nm{font-family:"Lalezar";font-size:40px;color:#F4EFE4;letter-spacing:.04em}
#badge .tg{font-weight:800;font-size:26px;color:#F2B035;direction:rtl;border-left:2px solid rgba(242,176,53,.5);padding-left:14px}
#endcard{position:absolute;left:0;right:0;top:640px;display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0}
#endcard .logo{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd77a,#F2B035 45%,#8a5a12);display:flex;align-items:center;justify-content:center;font-family:"Lalezar";font-size:110px;color:#120c02;box-shadow:0 0 90px rgba(242,176,53,.55)}
#endcard .h{font-family:"Lalezar";font-size:92px;color:#F4EFE4;direction:ltr;text-shadow:0 8px 30px #000}
#endcard .f{font-weight:900;font-size:58px;color:#F2B035;text-shadow:0 6px 24px #000}
/* ---- dynamic: narration + beats that change every <=2.5 s ---- */
.dyn #stage{top:330px;height:1000px}
#subs{position:absolute;left:60px;right:60px;bottom:260px;height:260px;display:flex;align-items:flex-end;justify-content:center;text-align:center}
#subs .sub{position:absolute;bottom:0;left:0;right:0;display:none;font-weight:900;font-size:72px;line-height:1.4;paint-order:stroke fill;-webkit-text-stroke:10px rgba(0,0,0,.9);text-shadow:0 4px 24px rgba(0,0,0,.95)}
#subs .sub .k{color:var(--accent)}
.kw{font-family:"Lalezar","Cairo";font-size:150px;line-height:1.15;color:#F4EFE4;text-shadow:0 10px 50px rgba(0,0,0,.9)}
.kw .hl{color:var(--accent)}
.dcard{position:absolute;left:50%;top:430px;width:720px;height:720px;margin-left:-360px;border:16px solid #f3ede0;border-bottom-width:70px;border-radius:6px;box-shadow:0 40px 90px rgba(0,0,0,.85);overflow:hidden;opacity:0;background:#222}
.dcard img{width:100%;height:100%;object-fit:cover;filter:sepia(.25) contrast(1.05)}

</style>
</head>
<body>
<div id="root">
  <canvas id="bg" width="1480" height="2320"></canvas>
  <canvas id="parts" width="1080" height="1920"></canvas>
  <div id="photos"></div>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;opacity:.10;mix-blend-mode:overlay"></canvas>
  <div id="top"><div class="pill" id="tag">قصة حقيقية</div><div id="prog"><i></i></div></div>
  <div id="stage"></div>
  <div id="subs"></div>
  <div id="brand"></div>
  <div id="idframe"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
  <div id="endcard"><div class="logo">5S</div><div class="h">@5ssj5</div><div class="f">تابعني حتى ما تفوتك قصة</div></div>
  <div id="flash"></div>
</div>
<script>
const S = window.STORY;
document.documentElement.style.setProperty('--accent', S.accent || '#E8B04A');
document.getElementById('tag').textContent = S.tag || 'قصة حقيقية';
document.getElementById('brand').textContent = '';
const BRAND = S.brand || '5ssj5';
if (!S.keepAccent) { S.accent = '#F2B035'; document.documentElement.style.setProperty('--accent', S.accent); }
document.getElementById('tag').outerHTML = `<div id="badge"><div class="logo">5S</div><div class="nm">${BRAND}</div><div class="tg">${S.tag || 'قصة حقيقية'}</div></div>`;
document.querySelector('#endcard .h').textContent = '@' + BRAND;

// ---------- deterministic randomness ----------
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease = {
  out:t=>1-Math.pow(1-t,3),
  back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2
};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const prog=(t,a,d)=>clamp((t-a)/d);

// ---------- scene timing ----------
const WORD = 0.30;            // seconds between word reveals
const scenes = S.scenes.map(sc=>{
  const words = (sc.lines||[]).join(' ').split(/\s+/).filter(Boolean).length;
  const base = sc.type==='big'||sc.type==='emoji' ? 1.2 : 0.4;
  sc.dur = sc.dur || Math.max(2.8, base + words*WORD + 1.9);
  sc.gap = sc.wordGap || WORD;              // narrated scenes spread words over the voice
  return sc;
});
let acc=0; for(const sc of scenes){sc.start=acc; acc+=sc.dur;}
window.TOTAL = acc;
window.CUTS = scenes.map(s=>s.start);

// ---------- build DOM ----------
const CINEMA = S.style === 'cinema';
if (CINEMA) {
  document.getElementById('root').classList.add('cinema');
  const own = scenes.map(sc => sc.img);
  scenes.forEach((sc, i) => {
    delete sc.imgStyle;                       // no framed cards: always full screen
    if (!sc.img) {                            // never an empty screen: borrow the nearest photo
      for (let d = 1; d < scenes.length && !sc.img; d++) sc.img = own[i - d] || own[i + d];
      sc.reused = true;
    }
    sc.pan = sc.pan || (i % 2 ? -1 : 1);
    sc.zoomOut = i % 3 === 2;                 // vary the camera move
  });
}
const stage = document.getElementById('stage');
function wordsHTML(line){
  // *word* => highlighted
  return line.split(/\s+/).filter(Boolean).map(w=>{
    const hl = /^\*.*\*$/.test(w) || /^\*/.test(w) && false;
    const clean = w.replace(/\*/g,'');
    return `<span class="w${/\*/.test(w)?' hl':''}">${clean}</span>`;
  }).join('<span class="w"> </span>');
}
for(const sc of scenes){
  const el=document.createElement('div'); el.className='scene';
  let html='';
  if(sc.type==='big' && !CINEMA) html+=`<div class="big" data-big>${sc.big}</div>${sc.label?`<div class="biglabel">${sc.label}</div>`:''}`;
  if(sc.type==='emoji' && !CINEMA) html+=`<div class="emoji" data-emoji>${sc.emoji}</div>`;
  if(CINEMA && sc.say){
    const ws = sc.say.split(/\s+/).filter(Boolean), chunks = [];
    for (let k = 0; k < ws.length;) {            // 2-4 words, break after punctuation
      let n = 0, c = [];
      while (k < ws.length && n < 4) { c.push(ws[k]); n++; if (/[.،,؟?!…:]$/.test(ws[k++]) && n >= 2) break; }
      chunks.push(c);
    }
    const lead = sc.voiceLead || 0.25, speak = Math.max(1, sc.dur - lead - 0.35);
    const total = chunks.reduce((a, c) => a + c.join(' ').length, 0);
    let t0 = lead;
    sc.chunks = chunks.map(c => { const d = speak * c.join(' ').length / total; const o = {s: t0, e: t0 + d}; t0 += d; return o; });
    html += `<div class="lines" style="--fs:${sc.type==='hook'?84:74}px">` +
      chunks.map(c => `<div class="line sub">${c.map(w => `<span class="w">${w}</span>`).join('<span class="w"> </span>')}</div>`).join('') + `</div>`;
  } else if(sc.lines&&sc.lines.length){
    const fs = sc.fs || (CINEMA ? (sc.type==='hook'?80:68) : 0) || (sc.img&&sc.imgStyle==='card'?70:0) || (sc.type==='hook'?104:(sc.type==='big'||sc.type==='emoji'?72:88));
    html+=`<div class="lines" style="--fs:${fs}px">${sc.lines.map(l=>`<div class="line">${wordsHTML(l)}</div>`).join('')}</div>`;
  }
  if(sc.type==='cta') html+=`<div class="cta-arrow" data-arrow>⬇</div>`;
  html+=`<div class="ring" data-ring></div>`;
  el.innerHTML=html; el.style.opacity=0; stage.appendChild(el); sc.el=el;
  if(sc.img){
    if(sc.imgStyle==='card'){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<img src="${sc.img}">`; document.getElementById('root').insertBefore(c, document.getElementById('stage')); sc.card=c; el.classList.add('withcard'); }
    else { const ph=document.createElement('div'); ph.className='ph'+(sc.old!==false?' old':''); ph.innerHTML=`<img src="${sc.img}">`; document.getElementById('photos').appendChild(ph); sc.ph=ph; el.classList.add('withimg'); }
  }
  sc.words=[...el.querySelectorAll('.w')].filter(w=>w.textContent.trim());
  sc.subs=[...el.querySelectorAll('.sub')];
}


// ================= DYNAMIC MODE =================
// Narration + subtitles; the picture changes every <= BEAT seconds, but ONLY with things that
// belong to what the narrator is saying in that scene: the scene's own photo (full / framed)
// or the scene's own motion graphics (its number, emoji, keyword, and its "icons").
const DYN = S.style === 'dynamic';
const BEAT = 2.4;
let beats = [];
if (DYN) {
  const root = document.getElementById('root'); root.classList.add('dyn');
  const photos = document.getElementById('photos'), subs = document.getElementById('subs');
  let gi = 0;
  scenes.forEach((sc, i) => {
    sc.el.remove();
    if (sc.ph) { sc.ph.remove(); sc.ph = null; }
    if (sc.card) { sc.card.remove(); sc.card = null; }
    // motion variants of this scene
    const hlw = ((sc.lines || []).join(' ').match(/\*[^*]+\*/g) || []).map(w => w.replace(/\*/g, ''));
    const main = sc.type === 'big' ? `<div class="big" data-big>${sc.big}</div>${sc.label ? `<div class="biglabel">${sc.label}</div>` : ''}`
      : sc.type === 'emoji' ? `<div class="emoji" data-emoji>${sc.emoji}</div>`
      : `<div class="lines" style="--fs:${sc.type === 'hook' ? 104 : 88}px">${(sc.lines || []).map(l => `<div class="line">${wordsHTML(l)}</div>`).join('')}</div>` + (sc.type === 'cta' ? `<div class="cta-arrow" data-arrow>⬇</div>` : '');
    const variants = [main];
    for (const ic of (sc.icons || [])) {                 // [emoji, caption] pairs that show what is said
      const [em, cap] = Array.isArray(ic) ? ic : [ic, ''];
      variants.push(`<div class="emoji" data-emoji>${em}</div>${cap ? `<div class="kw"><span class="w hl">${cap}</span></div>` : ''}`);
    }
    if (hlw.length && sc.type !== 'big') variants.push(`<div class="kw">${hlw.map(w => `<span class="w hl">${w}</span>`).join('<br>')}</div>`);
    // subtitles = the narration, 2-4 words at a time
    if (sc.say) {
      const ws = sc.say.split(/\s+/).filter(Boolean), chunks = [];
      for (let k = 0; k < ws.length;) { let n = 0, c = [];
        while (k < ws.length && n < 4) { c.push(ws[k]); n++; if (/[.،,؟?!…:]$/.test(ws[k++]) && n >= 2) break; }
        chunks.push(c); }
      const lead = sc.voiceLead || 0.25, speak = Math.max(1, sc.dur - lead - 0.35);
      const tot = chunks.reduce((x, c) => x + c.join(' ').length, 0); let t0 = lead;
      sc.chunks = chunks.map(c => { const d = speak * c.join(' ').length / tot; const o = {s: t0, e: t0 + d}; t0 += d; return o; });
      sc.subs = chunks.map(c => { const d = document.createElement('div'); d.className = 'sub'; d.textContent = c.join(' '); subs.appendChild(d); return d; });
    }
    // shots: alternate photo shots (only this scene's photo) and this scene's motion variants
    const n = Math.max(1, Math.ceil(sc.dur / BEAT)), len = sc.dur / n;
    const shots = [];
    const pics = [].concat(sc.img ? [sc.img] : [], sc.imgs || []);
    let pk = 0, vk = 0;
    for (let b = 0; b < n; b++) {
      const wantPhoto = pics.length && (sc.type === 'big' || sc.type === 'emoji' ? b % 2 === 1 : b % 2 === 0);
      if (wantPhoto) { shots.push({kind: pk % 2 ? 'card' : 'photo', src: pics[pk % pics.length]}); pk++; }
      else { shots.push({kind: 'motion', html: variants[vk % variants.length]}); vk++; }
    }
    shots.forEach((sh, b) => {
      const bt = {sc, s: sc.start + b * len, e: sc.start + (b + 1) * len, kind: sh.kind, g: gi++};
      const r = rng(bt.g * 97 + (S.seed || 7));
      if (sh.kind === 'motion') {
        const el = document.createElement('div'); el.className = 'scene'; el.innerHTML = sh.html + `<div class="ring" data-ring></div>`;
        el.style.opacity = 0; stage.appendChild(el); bt.el = el;
        bt.words = [...el.querySelectorAll('.w')].filter(w => w.textContent.trim());
        bt.hasText = !!el.querySelector('.lines, .kw');   // on-screen words: hide the subtitle meanwhile
      } else {
        const d = document.createElement('div');
        if (sh.kind === 'photo') { d.className = 'ph' + (sc.old !== false ? ' old' : ''); photos.appendChild(d); }
        else { d.className = 'dcard'; root.insertBefore(d, stage); }
        d.innerHTML = `<img src="${sh.src}">`; bt.d = d;
        bt.z0 = 1.12 + r() * .12; bt.dz = (r() > .5 ? 1 : -1) * (.10 + r() * .08);
        bt.px = (r() * 2 - 1) * 70; bt.py = (r() * 2 - 1) * 60; bt.rot = (r() * 2 - 1) * 2.5;
        bt.ox = 30 + r() * 40; bt.oy = 25 + r() * 50;
      }
      beats.push(bt);
    });
  });
}
window.BEATS = beats.map(b => ({t: b.s, kind: b.kind, scene: scenes.indexOf(b.sc)}));
function animDyn(t) {
  for (const bt of beats) {
    const on = t >= bt.s - .12 && t < bt.e + .12, u = clamp((t - bt.s) / (bt.e - bt.s));
    const a = Math.min(ease.out(prog(t, bt.s - .12, .24)), 1 - ease.out(prog(t, bt.e - .12, .24)));
    if (bt.kind === 'photo') {
      bt.d.style.opacity = on ? a : 0; if (!on) continue;
      const punch = .10 * (1 - ease.out(prog(t, bt.s - .12, .45)));
      bt.d.style.transformOrigin = `${bt.ox}% ${bt.oy}%`;
      bt.d.style.transform = `scale(${bt.z0 + bt.dz * u + punch}) translate(${bt.px * (u - .5)}px,${bt.py * (u - .5)}px) rotate(${bt.rot * (u - .5)}deg)`;
    } else if (bt.kind === 'card') {
      bt.d.style.opacity = on ? a : 0; if (!on) continue;
      const p = prog(t, bt.s - .05, .55), e = ease.back(p);
      bt.d.style.transform = `translateY(${(1 - e) * 260}px) rotate(${(1 - e) * -14 + bt.rot * 2 + Math.sin(t * 1.3) * 1.2}deg) scale(${.95 + .08 * u})`;
    } else {
      const el = bt.el, vis = t >= bt.s && t < bt.e + .15, lt = t - bt.s;
      const inA = ease.out(prog(lt, 0, .3)), outA = 1 - ease.inOut(prog(t, bt.e - .12, .27));
      el.style.opacity = vis ? Math.min(inA, outA) : 0; if (!vis) continue;
      el.style.transform = `translateY(${(1 - inA) * 60}px) scale(${1 + (1 - outA) * .08 + .03 * u})`;
      bt.words.forEach((w, i) => { const p = prog(lt, .05 + i * .09, .3), e = ease.back(p);
        w.style.opacity = clamp(p * 1.6); w.style.transform = `translateY(${(1 - e) * 40}px) scale(${.6 + .4 * e})`; w.style.filter = `blur(${(1 - clamp(p * 1.4)) * 10}px)`; });
      const big = el.querySelector('[data-big]'), sc = bt.sc;
      if (big) { const p = prog(lt, .05, .5), e = ease.back(p); big.style.transform = `scale(${.3 + .7 * e + .025 * Math.sin(lt * 5) * (p >= 1)})`; big.style.opacity = clamp(p * 2);
        if (sc.count) big.textContent = (sc.prefix || '') + Math.round(sc.count * ease.out(prog(lt, .05, 1.1))) + (sc.suffix || ''); }
      const em = el.querySelector('[data-emoji]');
      if (em) { const p = prog(lt, .05, .5), e = ease.back(p); em.style.transform = `scale(${.2 + .8 * e}) rotate(${(1 - e) * -25 + Math.sin(lt * 2.2) * 5}deg) translateY(${Math.sin(lt * 2) * 12}px)`; em.style.opacity = clamp(p * 2); }
      const ring = el.querySelector('[data-ring]');
      if (ring) { const p = prog(lt, .15, 1.1); const s2 = 200 + p * 900; ring.style.width = ring.style.height = s2 + 'px'; ring.style.marginLeft = ring.style.marginTop = (-s2 / 2) + 'px'; ring.style.opacity = (1 - p) * .6; ring.style.top = '40%'; }
      const ar = el.querySelector('[data-arrow]');
      if (ar) { ar.style.transform = `translateY(${Math.abs(Math.sin(lt * 3.5)) * 30}px)`; ar.style.opacity = clamp(prog(lt, .4, .3)); }
    }
  }
  const textUp = beats.some(bt => bt.kind === 'motion' && bt.hasText && t >= bt.s - .1 && t < bt.e + .1);
  for (const sc of scenes) if (sc.subs) sc.subs.forEach((d, i) => { const c = sc.chunks[i], l2 = t - sc.start, lastc = i === sc.chunks.length - 1;
    const on = l2 >= c.s && (l2 < c.e || (lastc && l2 < sc.dur)); const p = prog(l2, c.s, .16), e = ease.back(p);
    d.style.display = on && !textUp ? 'block' : 'none'; d.style.transform = `scale(${.85 + .15 * e})`; d.style.opacity = clamp(p * 2); });
  let f = 0; for (const sc of scenes) { const lt = t - sc.start; if (lt >= 0 && lt < .18 && sc.start > 0) f = Math.max(f, (1 - lt / .18) * .25); }
  return f;
}

// ---------- background ----------
const bg=document.getElementById('bg').getContext('2d');
const parts=document.getElementById('parts').getContext('2d');
const grain=document.getElementById('grain').getContext('2d');
const R=rng(S.seed||7); const P=[...Array(70)].map(()=>({x:R()*1080,y:R()*1920,r:1+R()*3.5,s:12+R()*40,a:.15+R()*.5,ph:R()*6.28}));
const grains=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const id=g.createImageData(540,960);const r2=rng(100+k);for(let i=0;i<id.data.length;i+=4){const v=r2()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return c});
function drawBG(t){
  const w=1480,h=2320; const a=S.accent||'#E8B04A';
  bg.fillStyle=S.bg||'#0b0906'; bg.fillRect(0,0,w,h);
  const cx=w/2+Math.sin(t*.25)*180, cy=h*.42+Math.cos(t*.2)*160;
  let g=bg.createRadialGradient(cx,cy,0,cx,cy,900); g.addColorStop(0,a+'55'); g.addColorStop(.5,a+'14'); g.addColorStop(1,'transparent');
  bg.fillStyle=g; bg.fillRect(0,0,w,h);
  const cx2=w*.2+Math.cos(t*.17)*200, cy2=h*.8+Math.sin(t*.23)*140;
  g=bg.createRadialGradient(cx2,cy2,0,cx2,cy2,700); g.addColorStop(0,(S.accent2||'#3a5bd9')+'40'); g.addColorStop(1,'transparent');
  bg.fillStyle=g; bg.fillRect(0,0,w,h);
  // slow zoom
  const z=1+0.04*Math.sin(t*.3); document.getElementById('bg').style.transform=`scale(${z})`;
  parts.clearRect(0,0,1080,1920);
  for(const p of P){const y=((p.y - t*p.s)%1920+1920)%1920; const x=p.x+Math.sin(t*.8+p.ph)*20;
    parts.globalAlpha=p.a*(.6+.4*Math.sin(t*2+p.ph)); parts.fillStyle=a; parts.beginPath(); parts.arc(x,y,p.r,0,6.283); parts.fill();}
  parts.globalAlpha=1;
  grain.clearRect(0,0,540,960); grain.drawImage(grains[Math.floor(t*24)%grains.length],0,0);
}

// ---------- scene animation ----------
function animScene(sc,t){
  const lt=t-sc.start, el=sc.el;
  const inA=ease.out(prog(lt,0,.35)), outA=1-ease.inOut(prog(lt,sc.dur-.35,.35));
  const vis = lt>=-0.01 && lt<=sc.dur;
  el.style.opacity = vis ? Math.min(inA,outA) : 0;
  if(sc.ph){ // Ken Burns: slow zoom + drift, crossfade
    const a=Math.min(ease.out(prog(lt,-.3,.6)), 1-ease.inOut(prog(lt,sc.dur-.3,.6)));
    sc.ph.style.opacity = (lt>-.3&&lt<sc.dur+.3)?a:0;
    const k=clamp(lt/(sc.dur+.3)); const dir=(sc.pan||1);
    const z = sc.zoomOut ? 1.24-0.14*k : 1.08+0.14*k;
    const r = sc.reused ? 1.12 : 1;           // a borrowed photo is framed tighter so it looks new
    sc.ph.style.transform=`scale(${z*r}) translate(${dir*(-30+60*k)}px,${(sc.reused?40:0)-20*k}px)`;
  }
  if(sc.card){
    const p=prog(lt,0,.7), e=ease.back(p), o=1-ease.inOut(prog(lt,sc.dur-.35,.35));
    sc.card.style.opacity=(vis?Math.min(clamp(p*2),o):0);
    sc.card.style.transform=`translateY(${(1-e)*200}px) rotate(${(1-e)*-12+(sc.tilt||-3)}deg) scale(${1+.03*lt/sc.dur})`;
  }
  if(!vis) return;
  const exitShift = (1-outA)*-60;
  el.style.transform = `translateY(${(1-inA)*50+exitShift}px) scale(${1+(1-outA)*.04})`;
  if(sc.chunks){                                  // karaoke-style subtitle chunks
    sc.subs.forEach((d,i)=>{ const c=sc.chunks[i]; const last=i===sc.chunks.length-1;
      const on = lt>=c.s && (lt<c.e || last); const p=prog(lt,c.s,.18), e=ease.back(p);
      d.style.display = on ? 'block' : 'none';
      d.style.transform=`scale(${.85+.15*e})`; d.style.opacity=clamp(p*2); });
    const ar=el.querySelector('[data-arrow]'); if(ar){ ar.style.transform=`translateY(${Math.abs(Math.sin(lt*3.5))*30}px)`; ar.style.opacity=clamp(prog(lt,1.2,.4)); }
    return;
  }
  const wStart = sc.wordStart ?? ((sc.type==='big'||sc.type==='emoji') ? 1.0 : 0.25);
  sc.words.forEach((w,i)=>{
    const p = prog(lt, wStart+i*sc.gap, .32);
    const e = ease.back(p);
    w.style.opacity = clamp(p*1.6);
    w.style.transform = `translateY(${(1-e)*40}px) scale(${.6+.4*e})`;
    w.style.filter = `blur(${(1-clamp(p*1.4))*10}px)`;
  });
  const big=el.querySelector('[data-big]');
  if(big){
    const p=prog(lt,.1,.55), e=ease.back(p);
    big.style.transform=`scale(${.3+.7*e})`; big.style.opacity=clamp(p*2);
    if(sc.count){ const n=Math.round(sc.count*ease.out(prog(lt,.1,.9))); big.textContent=(sc.prefix||'')+n+(sc.suffix||''); }
    // gentle pulse after landing
    if(p>=1) big.style.transform=`scale(${1+.025*Math.sin((lt-.65)*5)})`;
  }
  const em=el.querySelector('[data-emoji]');
  if(em){ const p=prog(lt,.05,.6),e=ease.back(p); em.style.transform=`scale(${.2+.8*e}) rotate(${(1-e)*-25+Math.sin(lt*2.2)*4}deg) translateY(${Math.sin(lt*2)*10}px)`; em.style.opacity=clamp(p*2); }
  const ring=el.querySelector('[data-ring]');
  if(ring && (big||em)){ const p=prog(lt,.25,1.1); const s=200+p*900; ring.style.width=ring.style.height=s+'px'; ring.style.marginLeft=ring.style.marginTop=(-s/2)+'px'; ring.style.opacity=(1-p)*.6; ring.style.top=big?'38%':'35%'; }
  const ar=el.querySelector('[data-arrow]');
  if(ar){ ar.style.transform=`translateY(${Math.abs(Math.sin(lt*3.5))*30}px)`; ar.style.opacity=clamp(prog(lt,1.2,.4)); }
  // shake on emphasis
  if(sc.shake){ const s=(1-prog(lt,.15,.5))*14*(lt>.15?1:0); el.style.transform+=` translate(${Math.sin(lt*90)*s}px,${Math.cos(lt*70)*s}px)`; }
}

window.seek = function(t){
  drawBG(t);
  let f=0;
  if (DYN) f = animDyn(t); else for(const sc of scenes) animScene(sc,t);
  document.querySelector('#prog i').style.width = (clamp(t/TOTAL)*100)+'%';
  { const last = scenes[scenes.length - 1], lt = t - last.start, p = prog(lt, .2, .6), e = ease.back(p);
    const ec = document.getElementById('endcard'); const on = last.type === 'cta' && lt > 0;
    ec.style.opacity = on ? clamp(p * 2) : 0; ec.style.transform = `scale(${.5 + .5 * e}) translateY(${Math.sin(lt * 3) * 8}px)`;
    if (on) for (const b of beats) if (b.sc === last && b.el) b.el.style.opacity = 0;
    if (on) for (const b of beats) if (b.sc === last && b.d) b.d.style.opacity = Math.min(+b.d.style.opacity || 0, .35);
    const bd = document.getElementById('badge'); const bp = prog(t, 0, .6);
    bd.style.transform = `scale(${.7 + .3 * ease.back(bp)})`; bd.style.opacity = clamp(bp * 2); }
  // flash on scenes flagged
  for(const sc of scenes){ if(sc.flash){ const lt=t-sc.start; if(lt>=0&&lt<.35) f=Math.max(f,(1-lt/.35)*.55);} }
  document.getElementById('flash').style.opacity=f;
};
window.READY = document.fonts.ready.then(()=>new Promise(r=>setTimeout(r,300)));
</script>
