<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Lalezar&display=swap">
<style>
:root{--accent:#E8B04A;--bg1:#14100a;--bg2:#000;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Cairo",sans-serif;color:#F4EFE4}
#bg{position:absolute;inset:-200px}
#parts,#grain{position:absolute;inset:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75) 100%)}
#top{position:absolute;top:150px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px}
.pill{font-weight:800;font-size:34px;padding:8px 28px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);background:rgba(0,0,0,.35);letter-spacing:.02em}
#prog{width:640px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;margin-right:0;margin-left:auto}
#stage{position:absolute;left:90px;right:90px;top:360px;height:1100px;display:flex;align-items:center;justify-content:center}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
.lines{display:flex;flex-direction:column;gap:18px;align-items:center}
.line{font-weight:900;line-height:1.45;font-size:var(--fs,78px);text-shadow:0 6px 30px rgba(0,0,0,.8)}
.w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.w.hl{color:var(--accent)}
.big{font-family:"Lalezar","Cairo";font-size:260px;line-height:1;color:var(--accent);text-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent),0 10px 40px rgba(0,0,0,.9);direction:ltr;font-variant-numeric:tabular-nums}
.biglabel{font-weight:800;font-size:58px;color:#F4EFE4;opacity:.9}
.emoji{font-family:"Noto Color Emoji";font-size:230px;line-height:1;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:4px solid var(--accent);opacity:0}
.cta-arrow{font-size:120px;color:var(--accent);font-weight:900}
#brand{position:absolute;bottom:430px;left:0;right:0;text-align:center;font-weight:800;font-size:32px;color:rgba(244,239,228,.55)}
#photos{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.88) 100%)}
.ph.old img{filter:sepia(.35) contrast(1.08) saturate(.8)}
.card{position:absolute;left:50%;top:380px;width:600px;height:600px;margin-left:-300px;border:14px solid #f3ede0;border-bottom-width:60px;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.8);overflow:hidden;opacity:0;background:#222}
.card img{width:100%;height:100%;object-fit:cover}
.scene.withimg{justify-content:flex-end;padding-bottom:40px}
.scene.withcard{justify-content:flex-end;padding-bottom:0;top:720px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="root">
  <canvas id="bg" width="1480" height="2320"></canvas>
  <canvas id="parts" width="1080" height="1920"></canvas>
  <div id="photos"></div>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;opacity:.10;mix-blend-mode:overlay"></canvas>
  <div id="top"><div class="pill" id="tag">قصة حقيقية</div><div id="prog"><i></i></div></div>
  <div id="stage"></div>
  <div id="brand"></div>
  <div id="flash"></div>
</div>
<script>
const S = window.STORY;
document.documentElement.style.setProperty('--accent', S.accent || '#E8B04A');
document.getElementById('tag').textContent = S.tag || 'قصة حقيقية';
document.getElementById('brand').textContent = S.brand || '';

// ---------- deterministic randomness ----------
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease = {
  out:t=>1-Math.pow(1-t,3),
  back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2
};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const prog=(t,a,d)=>clamp((t-a)/d);

// ---------- scene timing ----------
const WORD = 0.30;            // seconds between word reveals
const scenes = S.scenes.map(sc=>{
  const words = (sc.lines||[]).join(' ').split(/\s+/).filter(Boolean).length;
  const base = sc.type==='big'||sc.type==='emoji' ? 1.2 : 0.4;
  sc.dur = sc.dur || Math.max(2.8, base + words*WORD + 1.9);
  sc.gap = sc.wordGap || WORD;              // narrated scenes spread words over the voice
  return sc;
});
let acc=0; for(const sc of scenes){sc.start=acc; acc+=sc.dur;}
window.TOTAL = acc;
window.CUTS = scenes.map(s=>s.start);

// ---------- build DOM ----------
const stage = document.getElementById('stage');
function wordsHTML(line){
  // *word* => highlighted
  return line.split(/\s+/).filter(Boolean).map(w=>{
    const hl = /^\*.*\*$/.test(w) || /^\*/.test(w) && false;
    const clean = w.replace(/\*/g,'');
    return `<span class="w${/\*/.test(w)?' hl':''}">${clean}</span>`;
  }).join('<span class="w"> </span>');
}
for(const sc of scenes){
  const el=document.createElement('div'); el.className='scene';
  let html='';
  if(sc.type==='big') html+=`<div class="big" data-big>${sc.big}</div>${sc.label?`<div class="biglabel">${sc.label}</div>`:''}`;
  if(sc.type==='emoji') html+=`<div class="emoji" data-emoji>${sc.emoji}</div>`;
  if(sc.lines&&sc.lines.length){
    const fs = sc.fs || (sc.img&&sc.imgStyle==='card'?70:0) || (sc.type==='hook'?104:(sc.type==='big'||sc.type==='emoji'?72:88));
    html+=`<div class="lines" style="--fs:${fs}px">${sc.lines.map(l=>`<div class="line">${wordsHTML(l)}</div>`).join('')}</div>`;
  }
  if(sc.type==='cta') html+=`<div class="cta-arrow" data-arrow>⬇</div>`;
  html+=`<div class="ring" data-ring></div>`;
  el.innerHTML=html; el.style.opacity=0; stage.appendChild(el); sc.el=el;
  if(sc.img){
    if(sc.imgStyle==='card'){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<img src="${sc.img}">`; document.getElementById('root').insertBefore(c, document.getElementById('stage')); sc.card=c; el.classList.add('withcard'); }
    else { const ph=document.createElement('div'); ph.className='ph'+(sc.old!==false?' old':''); ph.innerHTML=`<img src="${sc.img}">`; document.getElementById('photos').appendChild(ph); sc.ph=ph; el.classList.add('withimg'); }
  }
  sc.words=[...el.querySelectorAll('.w')].filter(w=>w.textContent.trim());
}

// ---------- background ----------
const bg=document.getElementById('bg').getContext('2d');
const parts=document.getElementById('parts').getContext('2d');
const grain=document.getElementById('grain').getContext('2d');
const R=rng(S.seed||7); const P=[...Array(70)].map(()=>({x:R()*1080,y:R()*1920,r:1+R()*3.5,s:12+R()*40,a:.15+R()*.5,ph:R()*6.28}));
const grains=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const id=g.createImageData(540,960);const r2=rng(100+k);for(let i=0;i<id.data.length;i+=4){const v=r2()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return c});
function drawBG(t){
  const w=1480,h=2320; const a=S.accent||'#E8B04A';
  bg.fillStyle=S.bg||'#0b0906'; bg.fillRect(0,0,w,h);
  const cx=w/2+Math.sin(t*.25)*180, cy=h*.42+Math.cos(t*.2)*160;
  let g=bg.createRadialGradient(cx,cy,0,cx,cy,900); g.addColorStop(0,a+'55'); g.addColorStop(.5,a+'14'); g.addColorStop(1,'transparent');
  bg.fillStyle=g; bg.fillRect(0,0,w,h);
  const cx2=w*.2+Math.cos(t*.17)*200, cy2=h*.8+Math.sin(t*.23)*140;
  g=bg.createRadialGradient(cx2,cy2,0,cx2,cy2,700); g.addColorStop(0,(S.accent2||'#3a5bd9')+'40'); g.addColorStop(1,'transparent');
  bg.fillStyle=g; bg.fillRect(0,0,w,h);
  // slow zoom
  const z=1+0.04*Math.sin(t*.3); document.getElementById('bg').style.transform=`scale(${z})`;
  parts.clearRect(0,0,1080,1920);
  for(const p of P){const y=((p.y - t*p.s)%1920+1920)%1920; const x=p.x+Math.sin(t*.8+p.ph)*20;
    parts.globalAlpha=p.a*(.6+.4*Math.sin(t*2+p.ph)); parts.fillStyle=a; parts.beginPath(); parts.arc(x,y,p.r,0,6.283); parts.fill();}
  parts.globalAlpha=1;
  grain.clearRect(0,0,540,960); grain.drawImage(grains[Math.floor(t*24)%grains.length],0,0);
}

// ---------- scene animation ----------
function animScene(sc,t){
  const lt=t-sc.start, el=sc.el;
  const inA=ease.out(prog(lt,0,.35)), outA=1-ease.inOut(prog(lt,sc.dur-.35,.35));
  const vis = lt>=-0.01 && lt<=sc.dur;
  el.style.opacity = vis ? Math.min(inA,outA) : 0;
  if(sc.ph){ // Ken Burns: slow zoom + drift, crossfade
    const a=Math.min(ease.out(prog(lt,-.3,.6)), 1-ease.inOut(prog(lt,sc.dur-.3,.6)));
    sc.ph.style.opacity = (lt>-.3&&lt<sc.dur+.3)?a:0;
    const k=clamp(lt/(sc.dur+.3)); const dir=(sc.pan||1);
    sc.ph.style.transform=`scale(${1.08+0.14*k}) translate(${dir*(-30+60*k)}px,${-20*k}px)`;
  }
  if(sc.card){
    const p=prog(lt,0,.7), e=ease.back(p), o=1-ease.inOut(prog(lt,sc.dur-.35,.35));
    sc.card.style.opacity=(vis?Math.min(clamp(p*2),o):0);
    sc.card.style.transform=`translateY(${(1-e)*200}px) rotate(${(1-e)*-12+(sc.tilt||-3)}deg) scale(${1+.03*lt/sc.dur})`;
  }
  if(!vis) return;
  const exitShift = (1-outA)*-60;
  el.style.transform = `translateY(${(1-inA)*50+exitShift}px) scale(${1+(1-outA)*.04})`;
  const wStart = sc.wordStart ?? ((sc.type==='big'||sc.type==='emoji') ? 1.0 : 0.25);
  sc.words.forEach((w,i)=>{
    const p = prog(lt, wStart+i*sc.gap, .32);
    const e = ease.back(p);
    w.style.opacity = clamp(p*1.6);
    w.style.transform = `translateY(${(1-e)*40}px) scale(${.6+.4*e})`;
    w.style.filter = `blur(${(1-clamp(p*1.4))*10}px)`;
  });
  const big=el.querySelector('[data-big]');
  if(big){
    const p=prog(lt,.1,.55), e=ease.back(p);
    big.style.transform=`scale(${.3+.7*e})`; big.style.opacity=clamp(p*2);
    if(sc.count){ const n=Math.round(sc.count*ease.out(prog(lt,.1,.9))); big.textContent=(sc.prefix||'')+n+(sc.suffix||''); }
    // gentle pulse after landing
    if(p>=1) big.style.transform=`scale(${1+.025*Math.sin((lt-.65)*5)})`;
  }
  const em=el.querySelector('[data-emoji]');
  if(em){ const p=prog(lt,.05,.6),e=ease.back(p); em.style.transform=`scale(${.2+.8*e}) rotate(${(1-e)*-25+Math.sin(lt*2.2)*4}deg) translateY(${Math.sin(lt*2)*10}px)`; em.style.opacity=clamp(p*2); }
  const ring=el.querySelector('[data-ring]');
  if(ring && (big||em)){ const p=prog(lt,.25,1.1); const s=200+p*900; ring.style.width=ring.style.height=s+'px'; ring.style.marginLeft=ring.style.marginTop=(-s/2)+'px'; ring.style.opacity=(1-p)*.6; ring.style.top=big?'38%':'35%'; }
  const ar=el.querySelector('[data-arrow]');
  if(ar){ ar.style.transform=`translateY(${Math.abs(Math.sin(lt*3.5))*30}px)`; ar.style.opacity=clamp(prog(lt,1.2,.4)); }
  // shake on emphasis
  if(sc.shake){ const s=(1-prog(lt,.15,.5))*14*(lt>.15?1:0); el.style.transform+=` translate(${Math.sin(lt*90)*s}px,${Math.cos(lt*70)*s}px)`; }
}

window.seek = function(t){
  drawBG(t);
  for(const sc of scenes) animScene(sc,t);
  document.querySelector('#prog i').style.width = (clamp(t/TOTAL)*100)+'%';
  // flash on scenes flagged
  let f=0; for(const sc of scenes){ if(sc.flash){ const lt=t-sc.start; if(lt>=0&&lt<.35) f=Math.max(f,(1-lt/.35)*.55);} }
  document.getElementById('flash').style.opacity=f;
};
window.READY = document.fonts.ready.then(()=>new Promise(r=>setTimeout(r,300)));
</script>
</body>
</html>
